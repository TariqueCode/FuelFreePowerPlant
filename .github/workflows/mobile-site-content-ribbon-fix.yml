name: Fix mobile Site Content ribbon
on:
  push:
    branches: [main]
jobs:
  patch:
    if: contains(github.event.head_commit.message, 'Apply mobile-only Site Content ribbon fix') == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch verified editor
        shell: python
        run: |
          from pathlib import Path
          p=Path('resources/views/admin/site-content/create.blade.php')
          s=p.read_text()
          marker='/* FF_MOBILE_ONLY_RIBBON_FIX_V2 */'
          if marker in s:
              print('Already patched')
              raise SystemExit(0)
          assert 'class="word-ribbon"' in s
          assert 'data-editor-tab="insert"' in s
          assert 'data-editor-tab="view"' in s
          assert 'class="topbar"' in Path('resources/views/layouts/portal.blade.php').read_text()
          css=r'''\n<style>\n/* FF_MOBILE_ONLY_RIBBON_FIX_V2 */\n@media (max-width:700px){\n  .editor-shell{overflow:visible!important;position:relative!important}\n  .editor-shell .word-ribbon{width:100%!important;max-width:100%!important;min-width:0!important;overflow:hidden!important}\n  .editor-shell .word-tabs{display:flex!important;flex-wrap:nowrap!important;width:100%!important;max-width:100%!important;overflow-x:auto!important;overflow-y:hidden!important;-webkit-overflow-scrolling:touch;touch-action:pan-x;scrollbar-width:none}\n  .editor-shell .word-tabs::-webkit-scrollbar{display:none}\n  .editor-shell .word-panel{display:none!important;flex:0 0 100%!important;flex-wrap:nowrap!important;align-items:stretch!important;width:100%!important;min-width:100%!important;max-width:100%!important;overflow-x:auto!important;overflow-y:hidden!important;-webkit-overflow-scrolling:touch;touch-action:pan-x;overscroll-behavior-x:contain;scrollbar-width:thin}\n  .editor-shell .word-panel.active,.editor-shell .word-panel[aria-hidden="false"]{display:flex!important}\n  .editor-shell .word-panel>*{flex:0 0 auto!important}\n  .editor-shell .word-group{flex:0 0 auto!important;width:max-content!important;min-width:max-content!important;max-width:none!important;flex-wrap:nowrap!important}\n  .editor-shell .word-group-row{flex:0 0 auto!important;width:max-content!important;max-width:none!important;flex-wrap:nowrap!important}\n  .editor-shell .word-command,.editor-shell .word-icon,.editor-shell .word-select,.editor-shell .word-color{flex:0 0 auto!important}\n  .editor-shell.ff-mobile-ribbon-fixed .word-ribbon{position:fixed!important;top:var(--ff-mobile-ribbon-top,70px)!important;left:var(--ff-mobile-ribbon-left,0px)!important;width:var(--ff-mobile-ribbon-width,100%)!important;z-index:9999!important;margin:0!important}\n  .editor-shell.ff-mobile-ribbon-fixed .editor{padding-top:calc(14px + var(--ff-mobile-ribbon-height,0px))!important}\n}\n</style>\n'''
          js=r'''\n<script>\n(function(){\n  const shell=document.querySelector('.editor-shell');\n  if(!shell)return;\n  const ribbon=shell.querySelector('.word-ribbon');\n  const tabs=[...shell.querySelectorAll('[data-editor-tab]')];\n  const panels=[...shell.querySelectorAll('[data-editor-panel]')];\n  if(!ribbon||!tabs.length||!panels.length)return;\n  const isMobile=()=>window.matchMedia('(max-width:700px)').matches;\n  let current=tabs.find(t=>t.classList.contains('active'))?.dataset.editorTab||'home';\n  function setTab(name){\n    if(!tabs.some(t=>t.dataset.editorTab===name))return;\n    current=name;\n    tabs.forEach(t=>{const on=t.dataset.editorTab===name;t.classList.toggle('active',on);t.setAttribute('aria-selected',on?'true':'false');});\n    panels.forEach(p=>{const on=p.dataset.editorPanel===name;p.classList.toggle('active',on);p.hidden=!on;p.setAttribute('aria-hidden',on?'false':'true');p.style.display=on?'flex':'none';});\n  }\n  setTab(current);\n  ribbon.addEventListener('click',function(e){\n    const tab=e.target.closest?.('[data-editor-tab]');\n    if(!tab||!ribbon.contains(tab))return;\n    e.preventDefault();e.stopPropagation();\n    setTab(tab.dataset.editorTab);\n  },true);\n  ribbon.addEventListener('keydown',function(e){\n    const tab=e.target.closest?.('[data-editor-tab]');\n    if(!tab||!ribbon.contains(tab))return;\n    if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();setTab(tab.dataset.editorTab);}\n  },true);\n  let raf=0;\n  function sticky(){\n    raf=0;\n    if(!isMobile()){shell.classList.remove('ff-mobile-ribbon-fixed');return;}\n    const topbar=document.querySelector('.topbar');\n    const top=Math.max(0,Math.round(topbar?.getBoundingClientRect().bottom||0));\n    const sr=shell.getBoundingClientRect();\n    const h=ribbon.getBoundingClientRect().height;\n    const on=sr.top<=top && sr.bottom>top+h;\n    if(on){\n      shell.style.setProperty('--ff-mobile-ribbon-top',top+'px');\n      shell.style.setProperty('--ff-mobile-ribbon-left',sr.left+'px');\n      shell.style.setProperty('--ff-mobile-ribbon-width',sr.width+'px');\n      shell.style.setProperty('--ff-mobile-ribbon-height',h+'px');\n      shell.classList.add('ff-mobile-ribbon-fixed');\n    }else shell.classList.remove('ff-mobile-ribbon-fixed');\n  }\n  function req(){if(!raf)raf=requestAnimationFrame(sticky)}\n  window.addEventListener('scroll',req,{passive:true});\n  window.addEventListener('resize',req,{passive:true});\n  window.addEventListener('orientationchange',req,{passive:true});\n  if(window.ResizeObserver)new ResizeObserver(req).observe(ribbon);\n  sticky();\n})();\n</script>\n'''
          s=s.replace('</style>@endpush\n@push(\'head\')', css+'</style>@endpush\n@push(\'head\')', 1)
          s=s.replace('updateEditorMetrics();updateEditorToolbarState();\n\n\n\n\nconst publicationType', 'updateEditorMetrics();updateEditorToolbarState();\n'+js+'\n\n\n\n\nconst publicationType', 1)
          assert marker in s
          p.write_text(s)
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/views/admin/site-content/create.blade.php
          git diff --cached --quiet && exit 0
          git commit -m 'Apply mobile-only Site Content ribbon fix'
          git push
