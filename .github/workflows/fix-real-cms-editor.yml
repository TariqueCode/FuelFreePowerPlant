name: Fix actual CMS editor implementation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch the actual Site Content editor
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('resources/views/admin/site-content/create.blade.php')
          s = p.read_text()

          # This is the editor actually rendered by SiteContentController::create/edit.
          required = [
              'class="word-ribbon"',
              'id="upload-image"',
              'id="upload-video"',
              'id="media-input"',
              'id="video-input"',
              "document.getElementById('upload-image').onclick",
              "document.getElementById('upload-video').onclick",
          ]
          for marker in required:
              if marker not in s:
                  raise SystemExit(f'Missing expected CMS editor marker: {marker}')

          old_media = '''        <button type="button" class="word-command" id="upload-image" title="Upload image"><i class="fa-regular fa-image"></i><span>Picture</span></button>
        <button type="button" class="word-command" id="insert-image-url" title="Insert image from URL"><i class="fa-solid fa-image"></i><span>Image URL</span></button>
        <button type="button" class="word-command" id="upload-video" title="Upload video"><i class="fa-solid fa-video"></i><span>Video</span></button>
        <button type="button" class="word-command" id="insert-video-url" title="Insert video from URL"><i class="fa-solid fa-link"></i><span>Video URL</span></button>'''
          new_media = '''        <button type="button" class="word-command ff-media-command" id="upload-media" title="Upload one or multiple images and videos"><i class="fa-solid fa-photo-film"></i><span>Media</span></button>
        <button type="button" class="word-command" id="insert-image-url" title="Insert image from URL"><i class="fa-solid fa-image"></i><span>Image URL</span></button>
        <button type="button" class="word-command" id="insert-video-url" title="Insert video from URL"><i class="fa-solid fa-link"></i><span>Video URL</span></button>'''
          if old_media not in s:
              raise SystemExit('Media toolbar block did not match; refusing blind edit.')
          s = s.replace(old_media, new_media, 1)

          old_inputs = '<input id="media-input" type="file" hidden accept="image/jpeg,image/png,image/webp,image/gif"><input id="gallery-input" type="file" hidden multiple accept="image/jpeg,image/png,image/webp,image/gif"><input id="video-input" type="file" hidden accept="video/mp4,video/webm">'
          new_inputs = '<input id="media-input" type="file" hidden multiple accept="image/jpeg,image/png,image/webp,image/gif,image/svg+xml,video/mp4,video/webm,video/quicktime"> <input id="gallery-input" type="file" hidden multiple accept="image/jpeg,image/png,image/webp,image/gif"> <input id="video-input" type="file" hidden accept="video/mp4,video/webm">'
          if old_inputs not in s:
              raise SystemExit('Media input block did not match; refusing blind edit.')
          s = s.replace(old_inputs, new_inputs, 1)

          old_upload = "document.getElementById('upload-image').onclick=()=>mediaInput.click();mediaInput.onchange=async()=>{if(!mediaInput.files[0])return;try{const d=await upload(mediaInput.files[0]);exec('insertHTML',`<img src=\\\"${d.url}\\\" alt=\\\"${safeName(d.name)}\\\" loading=\\\"lazy\\\">`)}catch(e){alert(e.message)}mediaInput.value=''};\ndocument.getElementById('upload-video').onclick=()=>videoInput.click();videoInput.onchange=async()=>{if(!videoInput.files[0])return;try{const d=await upload(videoInput.files[0]);exec('insertHTML',`<video controls preload=\\\"metadata\\\" src=\\\"${d.url}\\\"></video>`)}catch(e){alert(e.message)}videoInput.value=''};"
          # Match the live source without depending on escaped quoting details.
          pattern = re.compile(r"document\.getElementById\('upload-image'\)\.onclick=.*?videoInput\.value=''\};", re.S)
          m = pattern.search(s)
          if not m:
              raise SystemExit('Existing image/video upload handlers not found; refusing blind edit.')
          new_upload = r'''document.getElementById('upload-media').onclick=()=>mediaInput.click();
mediaInput.onchange=async()=>{const files=[...mediaInput.files];if(!files.length)return;const valid=files.filter(file=>/^(image\\/(jpeg|png|webp|gif|svg\\+xml)|video\\/(mp4|webm|quicktime))$/i.test(file.type));if(!valid.length){alert('Please select JPG, PNG, WEBP, GIF, SVG, MP4, WEBM or MOV files.');mediaInput.value='';return;}const maxBytes=100*1024*1024;const oversized=valid.find(file=>file.size>maxBytes);if(oversized){alert(oversized.name+' is larger than 100 MB.');mediaInput.value='';return;}const button=document.getElementById('upload-media');button.disabled=true;button.classList.add('is-loading');try{const uploads=await Promise.all(valid.map(upload));const html=uploads.map(d=>d.mime.startsWith('video/')?`<video controls preload="metadata" playsinline src="${d.url}"></video>`:`<img src="${d.url}" alt="${safeName(d.name)}" loading="lazy">`).join('<p><br></p>');exec('insertHTML',html)}catch(e){alert(e.message)}finally{button.disabled=false;button.classList.remove('is-loading');mediaInput.value=''}};'''
          s = s[:m.start()] + new_upload + s[m.end():]

          css = r'''
/* Actual CMS editor mobile rail + Word-like image resize. Scoped to Site Content editor only. */
.word-ribbon .word-panel{min-width:0;}
.ff-media-command.is-loading{opacity:.55;pointer-events:none}
.editor .ff-image-selected{outline:2px solid #43c2e5;outline-offset:3px;cursor:se-resize;}
.ff-image-resize-handle{position:fixed;width:14px;height:14px;border-radius:50%;background:#43c2e5;border:2px solid #061923;box-shadow:0 3px 12px rgba(0,0,0,.4);z-index:10050;display:none;touch-action:none;cursor:nwse-resize;}
@media(max-width:700px){
  .word-ribbon{width:100%!important;max-width:100%!important;min-width:0!important;overflow:hidden!important;}
  .word-ribbon .word-tabs{display:flex!important;flex-wrap:nowrap!important;align-items:center;overflow-x:auto!important;overflow-y:hidden!important;width:100%!important;max-width:100%!important;min-width:0!important;white-space:nowrap!important;scrollbar-width:none!important;-webkit-overflow-scrolling:touch!important;touch-action:pan-x!important;}
  .word-ribbon .word-tabs::-webkit-scrollbar{display:none!important}
  .word-ribbon .word-panel{display:flex!important;flex-direction:row!important;flex-wrap:nowrap!important;align-items:stretch!important;justify-content:flex-start!important;gap:0!important;width:100%!important;max-width:100%!important;min-width:0!important;overflow-x:auto!important;overflow-y:hidden!important;scrollbar-width:none!important;-webkit-overflow-scrolling:touch!important;touch-action:pan-x!important;overscroll-behavior-x:contain!important;}
  .word-ribbon .word-panel::-webkit-scrollbar{display:none!important}
  .word-ribbon .word-group{display:flex!important;flex:0 0 auto!important;flex-direction:column!important;flex-wrap:nowrap!important;width:max-content!important;min-width:max-content!important;max-width:none!important;}
  .word-ribbon .word-group-row{display:flex!important;flex:0 0 auto!important;flex-wrap:nowrap!important;width:max-content!important;max-width:none!important;}
  .word-ribbon .word-command,.word-ribbon .word-icon,.word-ribbon .word-select,.word-ribbon .word-color{flex:0 0 auto!important;white-space:nowrap!important;}
  .word-ribbon .word-group-label{white-space:nowrap!important;}
}
'''
          if 'Actual CMS editor mobile rail + Word-like image resize' not in s:
              s = s.replace('</style>', css + '</style>', 1)

          js = r'''

// Actual Site Content editor media + image resize behavior.
(function(){
  const cmsEditor=document.getElementById('editor');
  const cmsShell=document.querySelector('.editor-shell');
  const cmsMedia=document.getElementById('media-input');
  const mediaButton=document.getElementById('upload-media');
  if(!cmsEditor||!cmsShell||!cmsMedia||!mediaButton)return;

  let selectedImage=null;
  let resizeHandle=null;
  let resizeState=null;

  function clearSelectedImage(){
    if(selectedImage)selectedImage.classList.remove('ff-image-selected');
    selectedImage=null;
    if(resizeHandle)resizeHandle.style.display='none';
  }

  function ensureResizeHandle(){
    if(resizeHandle)return resizeHandle;
    resizeHandle=document.createElement('div');
    resizeHandle.className='ff-image-resize-handle';
    resizeHandle.setAttribute('aria-hidden','true');
    document.body.appendChild(resizeHandle);
    return resizeHandle;
  }

  function positionResizeHandle(){
    if(!selectedImage||!document.body.contains(selectedImage)){clearSelectedImage();return;}
    const r=selectedImage.getBoundingClientRect();
    const h=ensureResizeHandle();
    h.style.display='block';
    h.style.left=Math.round(r.right-7)+'px';
    h.style.top=Math.round(r.bottom-7)+'px';
  }

  cmsEditor.addEventListener('click',function(e){
    const img=e.target.closest('img');
    if(img&&cmsEditor.contains(img)){
      if(selectedImage)selectedImage.classList.remove('ff-image-selected');
      selectedImage=img;
      selectedImage.classList.add('ff-image-selected');
      positionResizeHandle();
      return;
    }
    if(!e.target.closest('.ff-image-resize-handle'))clearSelectedImage();
  });

  function startResize(e){
    if(!selectedImage)return;
    e.preventDefault();
    e.stopPropagation();
    const r=selectedImage.getBoundingClientRect();
    resizeState={startX:e.clientX,startWidth:r.width};
    ensureResizeHandle().setPointerCapture?.(e.pointerId);
  }
  function moveResize(e){
    if(!resizeState||!selectedImage)return;
    e.preventDefault();
    const canvasWidth=Math.max(160,cmsEditor.clientWidth-36);
    const width=Math.max(80,Math.min(canvasWidth,resizeState.startWidth+(e.clientX-resizeState.startX)));
    selectedImage.style.width=Math.round(width)+'px';
    selectedImage.style.maxWidth='100%';
    selectedImage.style.height='auto';
    positionResizeHandle();
  }
  function endResize(){
    if(!resizeState)return;
    resizeState=null;
    sync();
  }

  ensureResizeHandle().addEventListener('pointerdown',startResize);
  ensureResizeHandle().addEventListener('pointermove',moveResize);
  ensureResizeHandle().addEventListener('pointerup',endResize);
  ensureResizeHandle().addEventListener('pointercancel',endResize);
  cmsEditor.addEventListener('scroll',positionResizeHandle,{passive:true});
  window.addEventListener('scroll',positionResizeHandle,{passive:true});
  window.addEventListener('resize',positionResizeHandle,{passive:true});
})();
'''
          marker = "form.addEventListener('submit',sync);"
          if 'Actual Site Content editor media + image resize behavior.' not in s:
              if marker not in s:
                  raise SystemExit('Could not find JS insertion point.')
              s = s.replace(marker, js + '\n' + marker, 1)

          # Validate structural expectations before committing.
          if s.count('<script>') != s.count('</script>'):
              raise SystemExit('Script tag count mismatch after patch.')
          if 'id="upload-media"' not in s or "document.getElementById('upload-media').onclick" not in s:
              raise SystemExit('Unified media control was not installed.')
          if 'ff-image-resize-handle' not in s:
              raise SystemExit('Image resize handle was not installed.')
          if 'id="upload-video"' in s:
              raise SystemExit('Legacy standalone upload-video control still present.')

          p.write_text(s)
      - name: Commit corrected implementation and remove patch workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/views/admin/site-content/create.blade.php
          git rm -f .github/workflows/fix-real-cms-editor.yml
          git commit -m "Fix actual CMS editor mobile media workflow" 
          git push origin main
      - name: Trigger normal CI/deploy with a source commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf '\n- Corrected the Site Content editor implementation target.\n' >> /tmp/cms-editor-note
          git checkout --orphan temp-trigger >/dev/null 2>&1 || true
          git checkout main >/dev/null 2>&1 || true
