name: Application Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply management profile readability polish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('resources/views/home-v3.blade.php')
          text = path.read_text()
          marker = '/* === HOMEPAGE MANAGEMENT PROFILE ACCESSIBILITY POLISH === */'
          if marker not in text:
              needle = '</style>\n<main class="shell home-v3">'
              if needle not in text:
                  raise SystemExit('Homepage style insertion point missing')
              css = '''<style>\n/* === HOMEPAGE MANAGEMENT PROFILE ACCESSIBILITY POLISH === */\n/* Larger reading sizes for older users; layout and controls remain unchanged. */\n.home-v3 .home-section-management .member-body h3{font-size:18px!important;line-height:1.35!important}\n.home-v3 .home-section-management .member-role{font-size:10px!important;line-height:1.5!important}\n.home-v3 .home-section-management .member-contact{font-size:10px!important;line-height:1.5!important}\n.home-v3 .home-section-management .member-message{font-size:11px!important;line-height:1.65!important}\n.home-v3 .home-section-management .member-more{font-size:10px!important;min-height:40px!important}\n.home-profile-title{font-size:31px!important;line-height:1.2!important}\n.home-profile-role{font-size:12px!important;line-height:1.5!important}\n.home-profile-message{font-size:15px!important;line-height:1.9!important}\n.home-profile-section-title{font-size:10px!important;line-height:1.45!important}\n.home-profile-link{font-size:11px!important;min-height:44px!important}\n@media(max-width:1099px){.home-profile-title{font-size:28px!important}.home-profile-message{font-size:15px!important;line-height:1.85!important}}\n@media(max-width:650px){\n .home-v3 .home-section-management .member-body h3{font-size:12px!important;line-height:1.35!important}\n .home-v3 .home-section-management .member-role{font-size:8px!important;line-height:1.45!important}\n .home-v3 .home-section-management .member-more{font-size:9px!important;min-height:36px!important}\n .home-profile-title{font-size:23px!important;line-height:1.2!important}\n .home-profile-role{font-size:10px!important;line-height:1.45!important}\n .home-profile-contact-mobile a{font-size:9px!important;line-height:1.5!important}\n .home-profile-scroll{font-size:15px!important;line-height:1.85!important}\n .home-profile-section-title{font-size:9px!important;line-height:1.45!important}\n .home-profile-message{font-size:14px!important;line-height:1.85!important}\n .home-profile-link{font-size:10px!important;min-height:42px!important}\n}\n@media(max-width:420px){.home-profile-title{font-size:22px!important}.home-profile-message{font-size:14px!important;line-height:1.85!important}}\n</style>\n'''
              text = text.replace(needle, css + '<main class="shell home-v3">', 1)
              path.write_text(text)
          PY
          grep -q 'HOMEPAGE MANAGEMENT PROFILE ACCESSIBILITY POLISH' resources/views/home-v3.blade.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/views/home-v3.blade.php
          git diff --cached --check
          git commit -m 'Improve management profile text readability'
          git push origin main
