# Final management-card QA trigger
name: Application Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  php:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fuelfree_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite, pdo_mysql, dom, xml, xmlwriter, fileinfo, ctype
          coverage: none

      - name: Lint controllers
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do echo "Linting $file"; php -l "$file"; done < <(find app/Http/Controllers -type f -name '*.php' -print0)

      - name: Lint middleware
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do echo "Linting $file"; php -l "$file"; done < <(find app/Http/Middleware -type f -name '*.php' -print0)

      - name: Lint models and services
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do echo "Linting $file"; php -l "$file"; done < <(find app/Models app/Services app/Support -type f -name '*.php' -print0)

      - name: Lint Cleanup command
        run: php -l app/Console/Commands/CleanupUploadSessions.php
      - name: Lint admin creation command
        run: php -l app/Console/Commands/CreateFuelFreeAdmin.php
      - name: Lint helpdesk sync command
        run: php -l app/Console/Commands/SyncHelpdeskMail.php

      - name: Lint config and routes
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Linting $file"
            php -l "$file"
          done < <(find config routes -type f -name '*.php' -print0)

      - name: Lint database PHP
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Linting $file"
            php -l "$file"
          done < <(find database -type f -name '*.php' -print0)

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts

      - name: Prepare test environment
        run: cp .env.example .env

      - name: Prepare SQLite database
        run: |
          mkdir -p database
          touch database/database.sqlite

      - name: Migrate schema batch 1
        shell: bash
        run: |
          set -euo pipefail
          for file in $(find database/migrations -type f -name '*.php' | sort | sed -n '1,10p'); do echo "Migrating $file"; php artisan migrate --force --path="$file"; done

      - name: Migrate schema batch 2
        shell: bash
        run: |
          set -euo pipefail
          for file in $(find database/migrations -type f -name '*.php' | sort | sed -n '11,20p'); do echo "Migrating $file"; php artisan migrate --force --path="$file"; done

      - name: Migrate schema batch 3
        shell: bash
        run: |
          set -euo pipefail
          for file in $(find database/migrations -type f -name '*.php' | sort | sed -n '21,30p'); do echo "Migrating $file"; php artisan migrate --force --path="$file"; done

      - name: Migrate schema batch 4
        shell: bash
        run: |
          set -euo pipefail
          for file in $(find database/migrations -type f -name '*.php' | sort | sed -n '31,40p'); do echo "Migrating $file"; php artisan migrate --force --path="$file"; done

      - name: Migrate schema batch 5
        shell: bash
        run: |
          set -euo pipefail
          for file in $(find database/migrations -type f -name '*.php' | sort | sed -n '41,50p'); do echo "Migrating $file"; php artisan migrate --force --path="$file"; done

      - name: Migrate schema batch 6
        shell: bash
        run: |
          set -euo pipefail
          for file in $(find database/migrations -type f -name '*.php' | sort | sed -n '51,70p'); do echo "Migrating $file"; php artisan migrate --force --path="$file"; done

      - name: Run Laravel package discovery
        run: php artisan package:discover --ansi

      - name: Generate test application key
        run: php artisan key:generate --force

      - name: Check Composer platform requirements
        run: composer check-platform-reqs --lock

      - name: Build frontend assets
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Verify canonical Page Builder routes
        run: php artisan route:list --path=admin/page-builder -v

      - name: Verify Laravel route cache
        run: php artisan route:cache --ansi

      - name: Run unit tests on SQLite
        run: php artisan test tests/Unit

      - name: Clear compiled views before feature suite
        run: php artisan view:clear

      - name: Run feature tests on SQLite
        run: php artisan test tests/Feature

      - name: Switch test environment to MySQL
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=mysql/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=3306/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=fuelfree_test/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=root/' .env
          php artisan config:clear

      - name: Verify MySQL connection
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: fuelfree_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan db:show --database=mysql

      - name: Migrate full production schema on MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: fuelfree_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan migrate --force

      - name: Verify MySQL route cache after migration
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: fuelfree_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan route:cache --ansi

      - name: Run feature tests on MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: fuelfree_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test tests/Feature
