name: Homepage profile card patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply approved homepage profile card CSS
        run: python3 .github/home-profile-card-patch.py
      - name: Commit patch and remove temporary tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/views/home-v3.blade.php
          git diff --cached --quiet || git commit -m 'Redesign homepage management profile cards'
          git rm .github/home-profile-card-patch.py .github/workflows/home-profile-card-patch.yml
          git commit -m 'Remove temporary homepage profile patch tooling'
          git push
