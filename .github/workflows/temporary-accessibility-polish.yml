name: Temporary Accessibility Polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Increase management profile reading sizes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('resources/views/home-v3.blade.php')
          text = path.read_text()
          marker = '/* ACCESSIBILITY: MANAGEMENT PROFILE READABILITY */'
          if marker in text:
              raise SystemExit('Accessibility readability patch is already present')

          css = r'''
/* ACCESSIBILITY: MANAGEMENT PROFILE READABILITY */
.home-section-management .member-body h3{font-size:clamp(17px,1.35vw,21px)!important;line-height:1.35!important;letter-spacing:-.01em!important}
.home-section-management .member-role{font-size:11px!important;line-height:1.5!important}
.home-section-management .member-contact{font-size:10.5px!important;line-height:1.5!important}
.home-section-management .member-message{font-size:12px!important;line-height:1.7!important}
.home-section-management .member-more{font-size:11px!important;min-height:42px!important}
.welcome-profile-name{font-size:14px!important;line-height:1.4!important}
.welcome-profile-role{font-size:10px!important;line-height:1.5!important}
.welcome-profile-message{font-size:10px!important;line-height:1.6!important}
.welcome-profile-hint{font-size:9px!important}
.welcome-profile-modal-title{font-size:clamp(28px,2.2vw,34px)!important;line-height:1.22!important}
.welcome-profile-modal-role{font-size:13px!important;line-height:1.5!important}
.welcome-profile-modal-scroll{font-size:16px!important;line-height:1.9!important}
.welcome-profile-modal-label{font-size:11px!important;line-height:1.45!important;letter-spacing:.1em!important}
@media(max-width:650px){
 .home-section-management .member-body h3{font-size:15px!important;line-height:1.35!important}
 .home-section-management .member-role{font-size:10px!important;line-height:1.5!important}
 .home-section-management .member-contact{font-size:10px!important;line-height:1.5!important}
 .home-section-management .member-message{font-size:11px!important;line-height:1.65!important}
 .home-section-management .member-more{font-size:10px!important;min-height:40px!important}
 .welcome-profile-name{font-size:14px!important}
 .welcome-profile-role{font-size:10px!important}
 .welcome-profile-message{font-size:10px!important;line-height:1.6!important}
 .welcome-profile-modal-title{font-size:26px!important;line-height:1.25!important}
 .welcome-profile-modal-role{font-size:12px!important;line-height:1.5!important}
 .welcome-profile-modal-scroll{font-size:16px!important;line-height:1.85!important}
 .welcome-profile-modal-label{font-size:11px!important}
}
@media(max-width:380px){
 .home-section-management .member-body h3{font-size:14px!important}
 .home-section-management .member-role{font-size:9.5px!important}
 .home-section-management .member-contact{font-size:9.5px!important}
 .home-section-management .member-message{font-size:10.5px!important}
 .home-section-management .member-more{font-size:9.5px!important}
}
'''

          closing = '</style>'
          if closing not in text:
              raise SystemExit('Missing closing style tag in home-v3.blade.php')
          text = text.replace(closing, css + '\n' + closing, 1)
          path.write_text(text)
          PY

      - name: Verify accessibility CSS patch
        run: |
          set -euo pipefail
          grep -q 'ACCESSIBILITY: MANAGEMENT PROFILE READABILITY' resources/views/home-v3.blade.php
          grep -q 'font-size:16px!important;line-height:1.9!important' resources/views/home-v3.blade.php
          grep -q 'font-size:11px!important;line-height:1.65!important' resources/views/home-v3.blade.php
          git diff --check

      - name: Commit and push patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/views/home-v3.blade.php
          git rm .github/workflows/temporary-accessibility-polish.yml
          git diff --cached --check
          git commit -m 'Improve management profile text readability'
          git push origin main
