name: One-time management polish

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-management-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply polish
        run: python3 .github/scripts/management_polish.py

      - name: Commit polish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/management/index.blade.php resources/views/partials/public-footer.blade.php
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Polish management contacts and spacing"
          git push origin main

      - name: Remove one-time runner
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-management-polish.yml .github/scripts/management_polish.py
          git commit -m "Remove one-time management polish runner"
          git push origin main
