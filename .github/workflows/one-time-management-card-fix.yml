name: One-time Management Card CSS Repair

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply final card layout override
        shell: python
        run: |
          from pathlib import Path
          p = Path('resources/views/home-v3.blade.php')
          text = p.read_text(encoding='utf-8')
          marker = '/* FINAL BOARD OF DIRECTORS CARD GEOMETRY REPAIR */'
          if marker in text:
              raise SystemExit('Final card geometry repair already present')
          css = r'''

/* FINAL BOARD OF DIRECTORS CARD GEOMETRY REPAIR */
.home-section-management .management-grid{
    grid-template-columns:repeat(2,minmax(0,1fr)) !important;
    gap:20px !important;
    align-items:stretch !important;
}
.home-section-management .member-card{
    display:grid !important;
    grid-template-columns:minmax(0,40%) minmax(0,60%) !important;
    grid-template-rows:auto !important;
    align-items:stretch !important;
    height:auto !important;
    min-height:0 !important;
}
.home-section-management .member-photo{
    width:100% !important;
    height:auto !important;
    aspect-ratio:4 / 5 !important;
    align-self:stretch !important;
    min-height:0 !important;
}
.home-section-management .member-body{
    min-width:0 !important;
    min-height:0 !important;
    height:auto !important;
    padding:22px !important;
    display:flex !important;
    flex-direction:column !important;
    justify-content:center !important;
    align-self:stretch !important;
}
.home-section-management .member-body h3{
    margin:0 !important;
    font-size:18px !important;
    line-height:1.25 !important;
}
.home-section-management .member-role{
    margin-top:6px !important;
    font-size:9px !important;
    line-height:1.35 !important;
}
.home-section-management .member-contacts{
    margin-top:13px !important;
    padding-top:0 !important;
    border-top:0 !important;
    gap:7px !important;
}
.home-section-management .member-contact{
    gap:8px !important;
    font-size:9px !important;
    line-height:1.35 !important;
}
.home-section-management .member-contact i{
    display:inline-block !important;
    width:13px !important;
    flex:0 0 13px !important;
    color:var(--cyan) !important;
    text-align:center !important;
    visibility:visible !important;
}
.home-section-management .member-contact span{
    overflow:visible !important;
    text-overflow:clip !important;
    white-space:normal !important;
}
.home-section-management .member-message{
    margin-top:13px !important;
    padding-top:0 !important;
    border-top:0 !important;
    color:#9ab7bf !important;
    font-size:10px !important;
    line-height:1.55 !important;
    font-weight:500 !important;
}
.home-section-management .member-message:before{content:none !important;display:none !important}
.home-section-management .member-more{
    width:auto !important;
    align-self:flex-start !important;
    min-height:38px !important;
    margin-top:15px !important;
    padding:9px 16px !important;
    justify-content:center !important;
    font-size:9px !important;
}

@media(min-width:651px) and (max-width:1099px){
    .home-section-management .management-grid{
        grid-template-columns:repeat(2,minmax(0,1fr)) !important;
        gap:16px !important;
    }
    .home-section-management .member-card{
        grid-template-columns:minmax(0,42%) minmax(0,58%) !important;
    }
    .home-section-management .member-photo{
        aspect-ratio:4 / 5 !important;
    }
    .home-section-management .member-body{
        padding:16px !important;
    }
    .home-section-management .member-body h3{font-size:15px !important}
    .home-section-management .member-contact{font-size:8px !important}
    .home-section-management .member-message{font-size:9px !important}
}

@media(max-width:650px){
    .home-section-management .management-grid{
        grid-template-columns:repeat(2,minmax(0,1fr)) !important;
        gap:10px !important;
    }
    .home-section-management .member-card{
        display:flex !important;
        flex-direction:column !important;
        height:100% !important;
        min-height:0 !important;
    }
    .home-section-management .member-photo{
        width:100% !important;
        aspect-ratio:1 / 1 !important;
        height:auto !important;
    }
    .home-section-management .member-body{
        padding:11px !important;
        display:flex !important;
        flex-direction:column !important;
        justify-content:flex-start !important;
        text-align:left !important;
    }
    .home-section-management .member-body h3{
        text-align:center !important;
        font-size:11px !important;
    }
    .home-section-management .member-role{
        text-align:center !important;
        font-size:7px !important;
    }
    .home-section-management .member-contacts{
        margin-top:9px !important;
        gap:5px !important;
    }
    .home-section-management .member-contact{
        font-size:7px !important;
        justify-content:flex-start !important;
    }
    .home-section-management .member-message{
        margin-top:9px !important;
        font-size:7px !important;
        text-align:left !important;
        -webkit-line-clamp:3 !important;
    }
    .home-section-management .member-more{
        width:100% !important;
        min-height:34px !important;
        margin-top:10px !important;
        padding:8px 7px !important;
        font-size:7px !important;
    }
}

@media(max-width:380px){
    .home-section-management .management-grid{gap:8px !important}
    .home-section-management .member-body{padding:9px !important}
    .home-section-management .member-body h3{font-size:10px !important}
    .home-section-management .member-role,.home-section-management .member-contact{font-size:6.5px !important}
    .home-section-management .member-message{font-size:6.5px !important}
    .home-section-management .member-more{font-size:6.5px !important}
}
'''
          p.write_text(text.rstrip() + css + '\n', encoding='utf-8')

      - name: Commit and push repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/views/home-v3.blade.php
          git diff --cached --quiet && exit 0
          git commit -m 'fix: align management cards to 4:5 image geometry'
          git push origin HEAD:main
