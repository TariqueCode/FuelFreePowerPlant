name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite, dom, xml, xmlwriter, fileinfo, ctype
          coverage: none
      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find app config routes database -type f -name '*.php' -print0)
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Bootstrap test environment
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan package:discover --ansi
      - name: Check Composer platform requirements
        run: composer check-platform-reqs --lock
      - name: Run tests
        run: php artisan test

  deploy:
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on cPanel server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          cd /home/fuelfree/public_html

          echo "==> Syncing application code"
          git fetch origin main
          git reset --hard origin/main

          echo "==> Locating Composer"
          if command -v composer >/dev/null 2>&1; then
              COMPOSER_BIN="$(command -v composer)"
          elif [ -x "$HOME/.local/bin/composer" ]; then
              COMPOSER_BIN="$HOME/.local/bin/composer"
          elif [ -x "/opt/cpanel/composer/bin/composer" ]; then
              COMPOSER_BIN="/opt/cpanel/composer/bin/composer"
          else
              echo "==> Composer not found; installing Composer locally"
              mkdir -p "$HOME/.local/bin"
              COMPOSER_INSTALLER="/tmp/composer-setup.php"

              curl -fsSL https://getcomposer.org/installer -o "$COMPOSER_INSTALLER"

              EXPECTED_CHECKSUM="$(curl -fsSL https://composer.github.io/installer.sig)"
              ACTUAL_CHECKSUM="$(php -r "echo hash_file('sha384', '$COMPOSER_INSTALLER');")"

              if [ "$EXPECTED_CHECKSUM" != "$ACTUAL_CHECKSUM" ]; then
                  echo "ERROR: Composer installer checksum verification failed."
                  rm -f "$COMPOSER_INSTALLER"
                  exit 1
              fi

              php "$COMPOSER_INSTALLER" --install-dir="$HOME/.local/bin" --filename=composer
              rm -f "$COMPOSER_INSTALLER"
              COMPOSER_BIN="$HOME/.local/bin/composer"
          fi

          if [ ! -x "$COMPOSER_BIN" ]; then
              echo "ERROR: Composer is not executable: $COMPOSER_BIN"
              exit 1
          fi

          echo "Using Composer: $COMPOSER_BIN"
          "$COMPOSER_BIN" --version

          echo "==> Checking production PHP runtime"
          php -r 'if (PHP_VERSION_ID < 80400) { fwrite(STDERR, "ERROR: FuelFree PowerPlant requires PHP 8.4+ on production. Current: ".PHP_VERSION."\\n"); exit(1); }'
          php -m | grep -E '^(dom|fileinfo|mbstring|xml|xmlwriter)
          "$COMPOSER_BIN" install --no-dev --prefer-dist --optimize-autoloader --no-interaction

          if command -v npm >/dev/null 2>&1; then
              echo "==> Building frontend assets"
              npm install --no-audit --no-fund
              npm run build
          else
              echo "WARNING: npm is not available; keeping existing public/build assets."
          fi

          echo "==> Running database migrations"
          php artisan migrate --force

          echo "==> Ensuring public storage link"
          php artisan storage:link --force

          echo "==> Clearing and rebuilding Laravel caches"
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          echo "==> Ensuring Laravel scheduler cron"
          CRON_LINE='* * * * * cd /home/fuelfree/public_html && php artisan schedule:run >> /dev/null 2>&1'
          if command -v crontab >/dev/null 2>&1; then
              (crontab -l 2>/dev/null | grep -Fv 'php artisan schedule:run' || true; echo "$CRON_LINE") | crontab -
          else
              echo "WARNING: crontab is not available; configure the Laravel scheduler cron manually."
          fi

          echo "==> Deployment complete"
          REMOTE

          rm -f ~/.ssh/deploy_key
 >/dev/null || {
              echo "ERROR: Required PHP extensions are missing. Need dom, fileinfo, mbstring, xml and xmlwriter."
              exit 1
          }

          echo "==> Installing PHP dependencies"
          "$COMPOSER_BIN" install --no-dev --prefer-dist --optimize-autoloader --no-interaction

          if command -v npm >/dev/null 2>&1; then
              echo "==> Building frontend assets"
              npm install --no-audit --no-fund
              npm run build
          else
              echo "WARNING: npm is not available; keeping existing public/build assets."
          fi

          echo "==> Running database migrations"
          php artisan migrate --force

          echo "==> Ensuring public storage link"
          php artisan storage:link --force

          echo "==> Clearing and rebuilding Laravel caches"
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          echo "==> Ensuring Laravel scheduler cron"
          CRON_LINE='* * * * * cd /home/fuelfree/public_html && php artisan schedule:run >> /dev/null 2>&1'
          if command -v crontab >/dev/null 2>&1; then
              (crontab -l 2>/dev/null | grep -Fv 'php artisan schedule:run' || true; echo "$CRON_LINE") | crontab -
          else
              echo "WARNING: crontab is not available; configure the Laravel scheduler cron manually."
          fi

          echo "==> Deployment complete"
          REMOTE

          rm -f ~/.ssh/deploy_key
