name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on cPanel server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          cd /home/fuelfree/public_html

          echo "==> Syncing application code"
          git fetch origin main
          git reset --hard origin/main

          echo "==> Installing PHP dependencies"
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

          if command -v npm >/dev/null 2>&1; then
              echo "==> Building frontend assets"
              npm install --no-audit --no-fund
              npm run build
          else
              echo "WARNING: npm is not available; keeping existing public/build assets."
          fi

          echo "==> Running database migrations"
          php artisan migrate --force

          echo "==> Clearing and rebuilding Laravel caches"
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache

          echo "==> Deployment complete"
          REMOTE

          rm -f ~/.ssh/deploy_key
