name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite, dom, xml, xmlwriter, fileinfo, intl, ctype
          coverage: none
      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file" >/dev/null; done < <(find app config routes database -type f -name '*.php' -print0)
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress --no-scripts
      - name: Prepare test environment
        run: cp .env.example .env
      - name: Prepare SQLite database
        run: |
          mkdir -p database
          touch database/database.sqlite
      - name: Migrate SQLite schema safely
        shell: bash
        run: |
          set -euo pipefail
          for range in '1,10' '11,20' '21,30' '31,40' '41,50' '51,70'; do
            for file in $(find database/migrations -type f -name '*.php' | sort | sed -n "${range}p"); do
              echo "Migrating $file"
              php artisan migrate --force --path="$file"
            done
          done
      - name: Run Laravel package discovery
        run: php artisan package:discover --ansi
      - name: Generate test application key
        run: php artisan key:generate --force
      - name: Check Composer platform requirements
        run: composer check-platform-reqs --lock
      - name: Build frontend assets
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Run tests
        run: php artisan test

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on cPanel server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /home/fuelfree/public_html

          echo "==> Syncing application code"
          git fetch origin main
          git reset --hard origin/main

          echo "==> Selecting CloudLinux PHP 8.4 CLI"
          PHP_BIN=/opt/alt/php84/usr/bin/php
          if [ ! -x "$PHP_BIN" ]; then
              echo "ERROR: Required CloudLinux PHP 8.4 binary is unavailable: $PHP_BIN"
              exit 1
          fi
          "$PHP_BIN" -v
          "$PHP_BIN" -r 'if (PHP_VERSION_ID < 80400) { fwrite(STDERR, "ERROR: PHP 8.4+ required.\n"); exit(1); }'

          echo "==> Locating Composer"
          if command -v composer >/dev/null 2>&1; then
              COMPOSER_BIN="$(command -v composer)"
          elif [ -x "$HOME/.local/bin/composer" ]; then
              COMPOSER_BIN="$HOME/.local/bin/composer"
          elif [ -x "/opt/cpanel/composer/bin/composer" ]; then
              COMPOSER_BIN="/opt/cpanel/composer/bin/composer"
          else
              echo "ERROR: Composer is not installed on production."
              exit 1
          fi
          "$PHP_BIN" "$COMPOSER_BIN" --version

          echo "==> Verifying required PHP extensions"
          for ext in pdo_mysql fileinfo intl mbstring; do
              if ! "$PHP_BIN" -m | grep -qi "^$ext$"; then
                  echo "ERROR: Required PHP extension is missing: $ext"
                  exit 1
              fi
          done

          test -f .env
          test -f artisan
          "$PHP_BIN" "$COMPOSER_BIN" install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-scripts

          echo "==> Restoring any previous production MySQL environment"
          if [ -f .env.mysql-recovery-backup ]; then
              cp .env.mysql-recovery-backup .env
              rm -f .env.mysql-recovery-backup
          fi

          echo "==> Clearing stale Laravel caches"
          "$PHP_BIN" artisan optimize:clear

          echo "==> Verifying production MySQL directly"
          DB_CONNECTION_VALUE="$(sed -n 's/^DB_CONNECTION=//p' .env | head -n1)"
          DB_HOST_VALUE="$(sed -n 's/^DB_HOST=//p' .env | head -n1)"
          DB_PORT_VALUE="$(sed -n 's/^DB_PORT=//p' .env | head -n1)"
          DB_DATABASE_VALUE="$(sed -n 's/^DB_DATABASE=//p' .env | head -n1)"
          DB_USERNAME_VALUE="$(sed -n 's/^DB_USERNAME=//p' .env | head -n1)"
          DB_PASSWORD_VALUE="$(sed -n 's/^DB_PASSWORD=//p' .env | head -n1)"
          if [ "$DB_CONNECTION_VALUE" != "mysql" ]; then
              echo "ERROR: Production .env must use DB_CONNECTION=mysql; refusing fallback mode."
              exit 1
          fi
          export FFP_DB_HOST="$DB_HOST_VALUE" FFP_DB_PORT="$DB_PORT_VALUE" FFP_DB_DATABASE="$DB_DATABASE_VALUE" FFP_DB_USERNAME="$DB_USERNAME_VALUE" FFP_DB_PASSWORD="$DB_PASSWORD_VALUE"
          "$PHP_BIN" -r '$dsn="mysql:host=".getenv("FFP_DB_HOST").";port=".getenv("FFP_DB_PORT").";dbname=".getenv("FFP_DB_DATABASE").";charset=utf8mb4"; try { $pdo=new PDO($dsn,getenv("FFP_DB_USERNAME"),getenv("FFP_DB_PASSWORD"),[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]); $pdo->query("SELECT 1"); echo "Production MySQL connection OK\n"; } catch (Throwable $e) { fwrite(STDERR,"ERROR: Production MySQL connection failed: ".$e->getMessage()."\n"); exit(1); }'

          echo "==> Running production migrations"
          "$PHP_BIN" artisan migrate --force

          echo "==> Refreshing package discovery"
          "$PHP_BIN" artisan package:discover --ansi

          if command -v npm >/dev/null 2>&1; then
              npm install --no-audit --no-fund
              npm run build
          fi

          "$PHP_BIN" artisan storage:link --force
          "$PHP_BIN" artisan optimize:clear
          "$PHP_BIN" artisan config:cache
          "$PHP_BIN" artisan route:cache
          "$PHP_BIN" artisan view:cache

          CRON_LINE="* * * * * cd /home/fuelfree/public_html && $PHP_BIN artisan schedule:run >> /dev/null 2>&1"
          if command -v crontab >/dev/null 2>&1; then
              (crontab -l 2>/dev/null | grep -Fv 'artisan schedule:run' || true; echo "$CRON_LINE") | crontab -
          fi

          "$PHP_BIN" artisan route:list --path=admin/menu-builder >/dev/null
          echo "==> Deployment complete"
          REMOTE

          rm -f ~/.ssh/deploy_key
