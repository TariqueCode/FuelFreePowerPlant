name: One-time Desktop Card Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: "!contains(github.event.head_commit.message, 'fix: repair desktop profile card layout v2')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply final desktop card override at stylesheet end
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('resources/views/home-v3.blade.php')
          s = p.read_text(encoding='utf-8')
          marker = '/* FINAL DESKTOP PROFILE CARD REPAIR V2 */'
          if marker in s:
              raise SystemExit(0)
          css = r'''
          <style>
          /* FINAL DESKTOP PROFILE CARD REPAIR V2 */
          @media (min-width: 1100px) {
              .home-v3 .home-section-management .management-grid {
                  display: grid !important;
                  width: 100% !important;
                  grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
                  gap: 20px !important;
                  align-items: start !important;
              }
              .home-v3 .home-section-management .member-card {
                  display: grid !important;
                  grid-template-columns: minmax(0, 40%) minmax(0, 60%) !important;
                  grid-template-rows: auto !important;
                  width: 100% !important;
                  height: auto !important;
                  min-height: 0 !important;
                  align-self: start !important;
                  overflow: hidden !important;
                  border-radius: 20px !important;
              }
              .home-v3 .home-section-management .member-photo {
                  grid-column: 1 !important;
                  grid-row: 1 !important;
                  width: 100% !important;
                  height: auto !important;
                  aspect-ratio: 4 / 5 !important;
                  min-height: 0 !important;
                  align-self: start !important;
                  overflow: hidden !important;
              }
              .home-v3 .home-section-management .member-photo img {
                  width: 100% !important;
                  height: 100% !important;
                  display: block !important;
                  object-fit: contain !important;
                  object-position: center center !important;
              }
              .home-v3 .home-section-management .member-body {
                  grid-column: 2 !important;
                  grid-row: 1 !important;
                  width: 100% !important;
                  height: auto !important;
                  min-height: 100% !important;
                  min-width: 0 !important;
                  display: flex !important;
                  flex-direction: column !important;
                  justify-content: center !important;
                  align-self: stretch !important;
                  padding: 22px 24px !important;
                  overflow: hidden !important;
              }
              .home-v3 .home-section-management .member-body h3 {
                  margin: 0 !important;
                  font-size: clamp(20px, 1.45vw, 25px) !important;
                  line-height: 1.28 !important;
                  text-align: left !important;
              }
              .home-v3 .home-section-management .member-role {
                  margin: 7px 0 0 !important;
                  font-size: 12px !important;
                  line-height: 1.45 !important;
                  text-align: left !important;
              }
              .home-v3 .home-section-management .member-contacts {
                  display: grid !important;
                  gap: 6px !important;
                  margin: 14px 0 0 !important;
                  padding: 0 !important;
                  border: 0 !important;
              }
              .home-v3 .home-section-management .member-contact {
                  display: flex !important;
                  gap: 0 !important;
                  font-size: 12px !important;
                  line-height: 1.5 !important;
              }
              .home-v3 .home-section-management .member-contact i {
                  display: none !important;
              }
              .home-v3 .home-section-management .member-message {
                  display: -webkit-box !important;
                  margin: 14px 0 0 !important;
                  padding: 0 !important;
                  border: 0 !important;
                  min-height: 0 !important;
                  height: auto !important;
                  max-height: 4.95em !important;
                  color: #a9c1c9 !important;
                  font-size: 14px !important;
                  line-height: 1.65 !important;
                  font-weight: 500 !important;
                  -webkit-line-clamp: 3 !important;
                  line-clamp: 3 !important;
                  overflow: hidden !important;
                  text-align: left !important;
              }
              .home-v3 .home-section-management .member-message:before {
                  content: none !important;
                  display: none !important;
              }
              .home-v3 .home-section-management .member-more {
                  display: inline-flex !important;
                  width: auto !important;
                  min-width: 210px !important;
                  min-height: 48px !important;
                  align-self: flex-start !important;
                  margin: 16px 0 0 !important;
                  padding: 9px 15px !important;
                  justify-content: center !important;
                  font-size: 13px !important;
                  line-height: 1.4 !important;
              }
          }
          </style>
          '''
          p.write_text(s.rstrip() + '\n\n' + css.strip() + '\n', encoding='utf-8')
          PY

      - name: Commit repair
        run: |
          git config user.name 'FuelFree PowerPlant Bot'
          git config user.email 'actions@github.com'
          git add resources/views/home-v3.blade.php
          git diff --cached --quiet && exit 0
          git commit -m 'fix: repair desktop profile card layout v2'
          git push
