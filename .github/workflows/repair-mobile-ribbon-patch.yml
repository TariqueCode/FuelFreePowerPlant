name: Repair mobile Site Content ribbon patch
on:
  push:
    branches: [main]
jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove malformed temporary patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('resources/views/admin/site-content/create.blade.php')
          s = p.read_text()
          marker = 'FF_MOBILE_ONLY_RIBBON_FIX_V2'
          assert marker in s, 'Expected malformed temporary patch marker not found'
          start = s.index('\\n<style>\\n/* FF_MOBILE_ONLY_RIBBON_FIX_V2 */')
          end = s.index('</style>\\n</style>@endpush', start)
          s = s[:start] + s[end + len('</style>\\n'):]
          script_marker = '\\n<script>\\n(function(){\\n  const shell=document.querySelector(\'.editor-shell\');'
          assert script_marker in s, 'Expected malformed nested script not found'
          js_start = s.index(script_marker)
          js_end = s.index('</script>\\n', js_start)
          s = s[:js_start] + s[js_end + len('</script>\\n'):]
          assert marker not in s
          assert '\\n<style>\\n/* FF_MOBILE_ONLY_RIBBON_FIX_V2 */' not in s
          p.write_text(s)
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add resources/views/admin/site-content/create.blade.php
          git diff --cached --quiet && exit 0
          git commit -m 'Repair mobile-only Site Content ribbon patch'
          git push
