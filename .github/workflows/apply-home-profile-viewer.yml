name: Apply Homepage Desktop Profile Viewer

on:
  push:
    paths:
      - '.github/workflows/apply-home-profile-viewer.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply reference desktop profile viewer
        shell: python
        run: |
          from pathlib import Path

          css_path = Path('resources/css/app.css')
          css_marker = '/* HOMEPAGE DESKTOP PROFILE VIEWER V2 */'
          css = r'''

/* HOMEPAGE DESKTOP PROFILE VIEWER V2 */
@media (min-width: 851px) {
  .home-v3 .home-profile-modal {
    padding: 28px !important;
    background: rgba(0,5,9,.82) !important;
    backdrop-filter: blur(18px) saturate(120%) !important;
  }

  .home-v3 .home-profile-panel {
    width: min(1180px, calc(100vw - 56px)) !important;
    height: min(760px, 88vh) !important;
    max-height: min(760px, 88vh) !important;
    display: grid !important;
    grid-template-columns: minmax(380px, 42%) minmax(0, 58%) !important;
    overflow: hidden !important;
    border-radius: 26px !important;
    border: 1px solid rgba(72,216,241,.28) !important;
    background: radial-gradient(650px 520px at 0 0,rgba(72,216,241,.09),transparent 68%),linear-gradient(145deg,#082633,#041923 58%,#021119) !important;
    box-shadow: 0 40px 120px rgba(0,0,0,.72),0 0 80px rgba(72,216,241,.07) !important;
  }

  .home-v3 .home-profile-photo {
    min-width: 0 !important;
    min-height: 0 !important;
    padding: 44px 34px 32px !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: stretch !important;
    justify-content: flex-start !important;
    gap: 18px !important;
    background: linear-gradient(180deg,#061923,#03131d) !important;
    border-right: 1px solid rgba(72,216,241,.16) !important;
    overflow: hidden !important;
  }

  .home-v3 .home-profile-photo img {
    width: 100% !important;
    height: auto !important;
    max-width: none !important;
    max-height: 470px !important;
    aspect-ratio: 4 / 5 !important;
    object-fit: cover !important;
    object-position: center top !important;
    display: block !important;
    border-radius: 18px !important;
    border: 1px solid rgba(72,216,241,.45) !important;
    box-shadow: 0 18px 45px rgba(0,0,0,.36) !important;
    flex: 0 0 auto !important;
  }

  .home-v3 .home-profile-desktop-identity {
    display: flex !important;
    flex-direction: column !important;
    min-width: 0 !important;
    gap: 0 !important;
  }

  .home-v3 .home-profile-desktop-identity h2 {
    margin: 0 !important;
    color: #effbfc !important;
    font-size: clamp(27px,2.1vw,34px) !important;
    line-height: 1.15 !important;
    letter-spacing: -.035em !important;
  }

  .home-v3 .home-profile-desktop-identity .desktop-role {
    margin-top: 8px !important;
    color: #55d4ed !important;
    font-size: 12px !important;
    line-height: 1.4 !important;
    font-weight: 800 !important;
    letter-spacing: .16em !important;
    text-transform: uppercase !important;
  }

  .home-v3 .home-profile-desktop-identity .desktop-rule {
    width: 52px !important;
    height: 3px !important;
    margin: 15px 0 16px !important;
    border-radius: 99px !important;
    background: #43d1f0 !important;
    box-shadow: 0 0 12px rgba(67,209,240,.32) !important;
  }

  .home-v3 .home-profile-desktop-identity .desktop-contact {
    display: flex !important;
    align-items: center !important;
    gap: 11px !important;
    min-width: 0 !important;
    margin-top: 8px !important;
    color: #d7e9ef !important;
    font-size: 13px !important;
    line-height: 1.45 !important;
    overflow-wrap: anywhere !important;
  }

  .home-v3 .home-profile-desktop-identity .desktop-contact i {
    width: 34px !important;
    height: 34px !important;
    flex: 0 0 34px !important;
    display: grid !important;
    place-items: center !important;
    border: 1px solid rgba(72,216,241,.22) !important;
    border-radius: 10px !important;
    background: rgba(72,216,241,.07) !important;
    color: #55dff2 !important;
  }

  .home-v3 .home-profile-desktop-identity .desktop-add-contact {
    width: 100% !important;
    min-height: 52px !important;
    margin-top: 18px !important;
    display: inline-flex !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 10px !important;
    border: 1px solid rgba(72,216,241,.28) !important;
    border-radius: 13px !important;
    background: linear-gradient(135deg,#42cfe9,#1590b1) !important;
    color: #021017 !important;
    font-size: 13px !important;
    font-weight: 850 !important;
  }

  .home-v3 .home-profile-info {
    min-width: 0 !important;
    min-height: 0 !important;
    display: flex !important;
    flex-direction: column !important;
    overflow: hidden !important;
  }

  .home-v3 .home-profile-head {
    flex: 0 0 auto !important;
    min-height: 74px !important;
    padding: 22px 28px 14px !important;
    display: flex !important;
    justify-content: flex-end !important;
    align-items: flex-start !important;
  }

  .home-v3 .home-profile-head > div { display: none !important; }

  .home-v3 .home-profile-close {
    width: 52px !important;
    height: 52px !important;
    flex: 0 0 52px !important;
    border-radius: 14px !important;
    border: 1px solid rgba(72,216,241,.22) !important;
    background: rgba(72,216,241,.055) !important;
    color: #effcff !important;
  }

  .home-v3 .home-profile-divider {
    margin: 0 28px !important;
    background: rgba(72,216,241,.14) !important;
  }

  .home-v3 .home-profile-scroll {
    min-height: 0 !important;
    flex: 1 1 auto !important;
    overflow-y: auto !important;
    padding: 24px 28px 28px !important;
    scrollbar-width: thin !important;
    scrollbar-color: rgba(72,216,241,.55) transparent !important;
  }

  .home-v3 .home-profile-scroll::-webkit-scrollbar { width: 8px !important; }
  .home-v3 .home-profile-scroll::-webkit-scrollbar-thumb { background: rgba(72,216,241,.48) !important; border-radius: 99px !important; }

  .home-v3 .home-profile-section-title {
    margin: 0 0 22px !important;
    color: #effbfc !important;
    font-size: clamp(25px,2.25vw,35px) !important;
    line-height: 1.18 !important;
    letter-spacing: -.025em !important;
    font-weight: 850 !important;
  }

  .home-v3 .home-profile-section-title::after {
    content: '' !important;
    display: block !important;
    width: 54px !important;
    height: 4px !important;
    margin-top: 18px !important;
    border-radius: 99px !important;
    background: #43d1f0 !important;
    box-shadow: 0 0 14px rgba(67,209,240,.28) !important;
  }

  .home-v3 .home-profile-message,
  .home-v3 .home-profile-message p,
  .home-v3 .home-profile-scroll p {
    max-width: none !important;
    color: #d7e9ef !important;
    font-size: 17px !important;
    line-height: 1.82 !important;
    letter-spacing: .003em !important;
    text-transform: none !important;
  }

  .home-v3 .home-profile-message p { margin: 0 0 18px !important; }

  .home-v3 .home-profile-footer { display: none !important; }
}

@media (min-width: 851px) and (max-width: 1100px) {
  .home-v3 .home-profile-panel { grid-template-columns: minmax(310px,40%) minmax(0,60%) !important; }
  .home-v3 .home-profile-photo { padding: 30px 24px 26px !important; }
  .home-v3 .home-profile-scroll { padding: 22px 24px 24px !important; }
  .home-v3 .home-profile-message,
  .home-v3 .home-profile-message p { font-size: 15px !important; line-height: 1.75 !important; }
}
'''
          current = css_path.read_text(encoding='utf-8')
          if css_marker not in current:
              css_path.write_text(current.rstrip() + css, encoding='utf-8')

          view = Path('resources/views/home-v3.blade.php')
          view_text = view.read_text(encoding='utf-8')
          js_marker = '/* HOMEPAGE DESKTOP PROFILE VIEWER V2 JS */'
          js = r'''

<script>
/* HOMEPAGE DESKTOP PROFILE VIEWER V2 JS */
(() => {
  const modal = document.getElementById('homeProfileModal');
  const photo = document.getElementById('homeProfilePhoto');
  const title = document.getElementById('homeProfileTitle');
  const role = document.getElementById('homeProfileRole');
  const links = document.getElementById('homeProfileLinks');
  const messageTitle = document.getElementById('homeProfileMessageTitle');
  if (!modal || !photo || !title || !role || !links || !messageTitle) return;

  const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
  const desktop = () => window.matchMedia('(min-width: 851px)').matches;

  let identity = photo.querySelector('.home-profile-desktop-identity');
  if (!identity) {
    identity = document.createElement('div');
    identity.className = 'home-profile-desktop-identity';
    identity.hidden = true;
    photo.appendChild(identity);
  }

  const render = () => {
    if (!desktop()) {
      identity.hidden = true;
      return;
    }
    const data = modal.querySelector('.home-profile-data');
    const activeCard = document.querySelector('.home-section-management .member-card.is-profile-active');
    const source = activeCard?.querySelector('.home-profile-data');
    const d = source?.dataset;
    if (!d) return;
    const name = d.name || title.textContent || '';
    const profileRole = d.role || role.textContent || 'Leadership';
    const phone = d.phone || '';
    const email = d.email || '';
    const vcard = d.vcard || '';
    const cleanPhone = phone.replace(/[^0-9+]/g, '');
    const contacts = [];
    if (phone) contacts.push('<a class="desktop-contact" href="tel:'+esc(cleanPhone)+'"><i class="fa-solid fa-phone"></i><span>'+esc(phone)+'</span></a>');
    if (email) contacts.push('<a class="desktop-contact" href="mailto:'+esc(email)+'"><i class="fa-solid fa-envelope"></i><span>'+esc(email)+'</span></a>');
    const add = vcard ? '<a class="desktop-add-contact" href="'+esc(vcard)+'"><i class="fa-solid fa-user-plus"></i><span>Add to Contacts</span></a>' : '';
    identity.innerHTML = '<h2>'+esc(name)+'</h2><div class="desktop-role">'+esc(profileRole)+'</div><div class="desktop-rule"></div>'+contacts.join('')+add;
    identity.hidden = false;
    messageTitle.textContent = 'MESSAGE FROM ' + profileRole.toUpperCase();
  };

  const markActive = () => {
    document.querySelectorAll('.home-section-management .member-card.is-profile-active').forEach(el => el.classList.remove('is-profile-active'));
    const titleText = title.textContent.trim();
    const card = [...document.querySelectorAll('.home-section-management .member-card')].find(el => el.querySelector('.home-profile-data')?.dataset?.name === titleText);
    if (card) card.classList.add('is-profile-active');
  };

  const observer = new MutationObserver(() => {
    if (modal.classList.contains('open')) {
      markActive();
      render();
    }
  });
  observer.observe(modal, {subtree:true, childList:true, characterData:true});
  window.addEventListener('resize', render, {passive:true});
  document.addEventListener('click', e => {
    const trigger = e.target.closest('.home-section-management .member-more');
    if (trigger) setTimeout(() => { markActive(); render(); }, 0);
  }, true);
})();
</script>
'''
          if js_marker not in view_text:
              view.write_text(view_text.rstrip() + js, encoding='utf-8')

      - name: Validate
        run: git diff --check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/css/app.css resources/views/home-v3.blade.php .github/workflows/apply-home-profile-viewer.yml
          git diff --cached --check
          git commit -m "feat: redesign homepage desktop profile viewer"
          git push origin main

      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          git rm .github/workflows/apply-home-profile-viewer.yml
          git commit -m "chore: remove temporary profile viewer workflow"
          git push origin main
