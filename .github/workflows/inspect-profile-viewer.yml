name: Inspect Profile Viewer
on:
  push:
    paths:
      - '.github/workflows/inspect-profile-viewer.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect profile viewer sources
        shell: bash
        run: |
          echo '=== matching files ==='
          grep -RIl --exclude-dir=.git -E 'welcome-profile|home-profile-modal|profile-modal' resources/views resources/js resources/css 2>/dev/null || true
          echo '=== matching lines ==='
          grep -RIn --exclude-dir=.git -E 'welcome-profile|home-profile-modal|profile-modal' resources/views resources/js resources/css 2>/dev/null | head -n 120 || true
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/inspect-profile-viewer.yml
          git commit -m "chore: remove profile viewer inspection workflow" || true
          git push origin main
