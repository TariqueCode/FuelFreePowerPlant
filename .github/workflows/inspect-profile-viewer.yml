name: Inspect Profile Viewer
on:
  push:
    paths:
      - '.github/workflows/inspect-profile-viewer.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect modal markup and JS
        shell: python
        run: |
          from pathlib import Path
          import re
          text=Path('resources/views/home-v3.blade.php').read_text(encoding='utf-8')
          for needle in ['<div class="welcome-profile-modal"','function openWelcomeProfile','openWelcomeProfile(','welcomeProfileModal']:
              print('\n===',needle,'===')
              for m in re.finditer(re.escape(needle),text):
                  print(text[max(0,m.start()-800):min(len(text),m.end()+5000)])
                  break
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/inspect-profile-viewer.yml
          git commit -m "chore: remove profile viewer inspection workflow" || true
          git push origin main
