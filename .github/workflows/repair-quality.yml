name: Repair Quality Workflow

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.event.head_commit.message == 'chore: repair quality workflow' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove stale one-shot accessibility patch
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/quality.yml')
          text = path.read_text(encoding='utf-8')
          begin = '      # ACCESSIBILITY_POLISH_BEGIN\n'
          end = '      # ACCESSIBILITY_POLISH_END\n'
          if begin not in text or end not in text:
              raise SystemExit('Stale accessibility patch block markers were not found.')
          start = text.index(begin)
          finish = text.index(end, start) + len(end)
          text = text[:start] + text[finish:]
          path.write_text(text, encoding='utf-8')

          Path('.github/workflows/repair-quality.yml').unlink()

      - name: Validate workflow cleanup
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'ACCESSIBILITY_POLISH_BEGIN' .github/workflows/quality.yml
          test ! -e .github/workflows/repair-quality.yml

      - name: Commit repaired workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/quality.yml .github/workflows/repair-quality.yml
          git diff --cached --check
          git commit -m 'fix: restore standard application quality workflow'
          git push origin HEAD:main
