name: Fix Profile Viewer JS
on:
  push:
    paths:
      - '.github/workflows/fix-profile-v3-js.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove mutation loop
        shell: python
        run: |
          from pathlib import Path
          p=Path('resources/views/home-v3.blade.php')
          s=p.read_text(encoding='utf-8')
          old="new MutationObserver(()=>{if(m.classList.contains('open'))apply()}).observe(m,{subtree:true,childList:true,characterData:true});"
          if old in s:
              s=s.replace(old,'')
              p.write_text(s,encoding='utf-8')
      - name: Check
        run: git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/home-v3.blade.php
          git commit -m "fix: prevent profile viewer mutation loop"
          git push origin main
